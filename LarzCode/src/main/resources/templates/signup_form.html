<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - LarzCode Game</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Press Start 2P', cursive; /* arcade-style font */
            background: linear-gradient(135deg, #1a1a2e, #162447);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Floating stars */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.8;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Game-themed card */
        .registration-card {
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #FFD700;
            padding: 2rem;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            z-index: 1;
            box-shadow: 0 0 20px #FFD700;
        }

        .registration-card h1 {
            font-weight: 700;
            margin-bottom: 2rem;
            color: #FFD700;
            text-shadow: 2px 2px #ff0000;
        }

        .form-label {
            font-weight: 700;
            color: #00FFFF;
        }

        .form-control {
            background-color: #162447;
            border: 2px solid #FFD700;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
        }

        .form-control:focus {
            border-color: #00FF00;
            box-shadow: none;
            background-color: #1a1a2e;
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            background: linear-gradient(to right, #FFD700, #FF4500);
            color: #000;
            border: 2px solid #fff;
            transition: transform 0.2s, background 0.3s;
            font-family: 'Press Start 2P', cursive;
        }

        .btn-submit:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #FF4500, #FFD700);
            color: #fff;
            border-color: #FFD700;
        }

        .login-link {
            margin-top: 1rem;
            display: block;
            color: #00FFFF;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            color: #FFD700;
        }
    </style>
</head>
<body>

    <!-- Floating stars -->
    <script>
        const numStars = 100;
        for(let i = 0; i < numStars; i++){
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * window.innerHeight + 'px';
            star.style.left = Math.random() * window.innerWidth + 'px';
            star.style.width = (Math.random() * 2 + 1) + 'px';
            star.style.height = (Math.random() * 2 + 1) + 'px';
            star.style.animationDuration = (2 + Math.random() * 3) + 's';
            document.body.appendChild(star);
        }
    </script>

    <div class="registration-card">
        <h1>Sign Up</h1>

        <form th:action="@{/process_register}" method="post" th:object="${user}">
            <!-- First Name -->
            <div class="form-group mb-3 row">
                <label class="col-form-label col-4">First Name</label>
                <div class="col-8">
                    <input type="text" class="form-control" th:field="*{firstName}" required minlength="2" maxlength="25"/>
                </div>
            </div>

            <!-- Last Name -->
            <div class="form-group mb-3 row">
                <label class="col-form-label col-4">Last Name</label>
                <div class="col-8">
                    <input type="text" class="form-control" th:field="*{lastName}" required minlength="2" maxlength="25"/>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group mb-3 row">
                <label class="col-form-label col-4">Email</label>
                <div class="col-8">
                    <input type="email" class="form-control" th:field="*{email}" required/>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group mb-3 row">
                <label class="col-form-label col-4">Password</label>
                <div class="col-8">
                    <input type="password" class="form-control" th:field="*{password}" required minlength="6" maxlength="25"/>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-group row">
                <div class="col-12">
                    <button type="submit" class="btn btn-submit">Sign Up</button>
                </div>
            </div>

            <!-- Login Link -->
            <a th:href="@{/login}" class="login-link">Already have an account? Login here</a>
        </form>
    </div>

</body>
</html>
