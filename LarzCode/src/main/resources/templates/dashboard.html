<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - LarzCode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: rgba(34, 32, 50, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        h1 {
            font-weight: 700;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn-custom {
            margin: 0.5rem;
            padding: 0.75rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 500;
            border-radius: 50px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .btn-list {
            background-color: #6a11cb;
            color: #fff;
        }

        .btn-list:hover {
            background-color: #2575fc;
        }

        .btn-logout {
            background-color: #ff4c4c;
            color: #fff;
        }

        .btn-logout:hover {
            background-color: #ff1a1a;
        }

        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            color: #ccc;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome, <span th:text="${#authentication.name}">User</span>!</h1>
        <p>Choose an action below:</p>

        <a th:href="@{/list_users}" class="btn btn-list btn-custom">List All Users</a>
        <a th:href="@{/logout}" class="btn btn-logout btn-custom">Logout</a>
    </div>

    <footer>
        &copy; 2026 LarzCode. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
